<!doctype html>
<html lang="ru">

<head>

    <meta charset="utf-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>
        DOSKorea — машины и гаджеты из Кореи
    </title>

    <meta
            name="description"
            content="DOSKorea: корейские автомобили, смартфоны и ноутбуки."
    >

    <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
    >

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
    >

    <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap"
            rel="stylesheet"
    >

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

</head>

<body>

<header class="top">

    <div class="wrap">

        <a
                class="logo"
                href="#/"
                aria-label="DOSKorea, на главную"
        >
            DOS<b>Korea</b>
        </a>

        <nav
                class="nav"
                aria-label="Основное меню"
        >

            <a
                    href="#/"
                    data-nav="home"
            >

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M3 10.5 12 3l9 7.5"/>

                        <path d="M5.5 9.5V21h13V9.5"/>

                        <path d="M9.5 21v-6h5v6"/>

                    </svg>

                </span>

                Главная

            </a>


            <a
                    href="#/cars"
                    data-nav="cars"
            >

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M5 16.5 6.8 9h10.4l1.8 7.5"/>

                        <path d="M4 16.5h16v3H4z"/>

                        <circle
                                cx="7.5"
                                cy="19.5"
                                r="1.5"
                        />

                        <circle
                                cx="16.5"
                                cy="19.5"
                                r="1.5"
                        />

                    </svg>

                </span>

                Машины

            </a>


            <a
                    href="#/gadgets"
                    data-nav="gadgets"
            >

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24">

                        <rect
                                x="7"
                                y="2.5"
                                width="10"
                                height="19"
                                rx="2"
                        />

                        <path d="M10 18.5h4"/>

                    </svg>

                </span>

                Гаджеты

            </a>


            <a
                    href="#/login"
                    data-nav="account"
                    id="account-nav"
            >

                <span class="nav-icon">

                    <svg viewBox="0 0 24 24">

                        <circle
                                cx="12"
                                cy="7.5"
                                r="3.5"
                        />

                        <path
                                d="M5 21c.5-4.2 3-6.5 7-6.5s6.5 2.3 7 6.5"
                        />

                    </svg>

                </span>

                <span id="account-label">
                    Войти
                </span>

            </a>


            <a
                    class="btn wa small hide-sm"
                    id="hdr-wa"
                    href="#"
                    target="_blank"
                    rel="noopener"
            >
                Написать в WhatsApp
            </a>

        </nav>

    </div>

</header>


<main
        id="app"
        tabindex="-1"
></main>


<footer class="foot">

    <div class="wrap">

        <span class="logo">
            DOS<b>Korea</b>
        </span>

        <span>
            Машины и гаджеты из Кореи.
            Заказ через WhatsApp.
        </span>

    </div>

</footer>


<script
        charset="utf-8"
        src="/js/api.js"
></script>

<script
        charset="utf-8"
        src="/js/app.js"
></script>

</body>

</html>
