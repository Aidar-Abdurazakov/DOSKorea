spring.application.name=doskorea
server.port=8080

# База данных: файл ./data/doskorea (H2). Для продакшена замените на PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/doskorea;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Загрузка фото
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB
app.upload-dir=${UPLOAD_DIR:./uploads}

# Ошибки отдаём в JSON с понятным сообщением
server.error.include-message=always

# Админ (ОБЯЗАТЕЛЬНО смените пароль через переменную окружения ADMIN_PASSWORD)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD}

# Номер WhatsApp в международном формате, только цифры (без + и пробелов)
app.whatsapp.number=${WHATSAPP_NUMBER:996998555000}

# Всегда отдавать ответы в UTF-8 (защита от «кракозябр»)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
